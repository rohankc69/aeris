[project]
name = "aeris"
version = "0.0.1"
description = "AERIS: open-source decision and coordination layer for civilian multi-drone search-and-rescue."
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "AERIS contributors" }]
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.optional-dependencies]
postgres = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
]

[project.scripts]
aeris = "aeris.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML",
    "types-shapely",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeris"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "ASYNC", "S", "PL"]
ignore = [
    "ANN401",  # Any in **kwargs is acceptable at boundaries
    "PLR2004", # magic value comparisons are checked by review, thresholds live in config
    "S101",    # asserts are fine in tests; production code uses explicit checks
]

[tool.ruff.lint.pylint]
max-args = 8  # keyword-only dependency-injection constructors

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises several services together (still offline)",
    "live: calls external services; only runs with --run-live",
]
