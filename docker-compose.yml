# AERIS Docker Compose.
#
# Nothing here is required for local development: the backend, dashboard, tests and every
# scenario run natively with `uv` and `pnpm` (fake fleet, mock AI, in-memory store).
#
#   docker compose up                      backend :8000 + dashboard :3000 (fake fleet, mock AI)
#   docker compose up -d postgres          optional durable store (PostgreSQL + PostGIS)
#   docker compose --profile px4 pull      fetch the prebuilt PX4 SITL and bridge images from GHCR
#   docker compose --profile px4 up        headless Gazebo + PX4 SITL vehicles + XRCE agent + ROS 2 bridge
#
# Give the Docker VM at least 4 CPUs and 5 GB; two vehicles are verified there, three is untested.
# Start the backend with AERIS_FLEET_PROVIDER=px4 (see docs/px4_bridge.md).

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      AERIS_ENV: ${AERIS_ENV:-development}
      AERIS_FLEET_PROVIDER: ${AERIS_FLEET_PROVIDER:-fake}
      AERIS_DECISION_PROVIDER: ${AERIS_DECISION_PROVIDER:-mock}
      AERIS_DECISION_FALLBACK: ${AERIS_DECISION_FALLBACK:-rules}
      AERIS_PX4_BRIDGE_URL: ws://bridge:8765
      AERIS_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-latest}
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_AERIS_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgis/postgis:16-3.4
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: aeris
      POSTGRES_PASSWORD: aeris
      POSTGRES_DB: aeris
    ports:
      - "5432:5432"
    volumes:
      - aeris_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeris"]
      interval: 5s
      timeout: 3s
      retries: 10

  px4-sim:
    # Pulled from GHCR by default (built by .github/workflows/px4-images.yml). To build locally
    # instead: docker compose --profile px4 build px4-sim   (compiles PX4; 30-40 minutes).
    image: ${AERIS_PX4_SIM_IMAGE:-ghcr.io/rohankc69/aeris-px4-sim:latest}
    build:
      context: docker/px4-sim
    profiles: ["px4"]
    environment:
      PX4_VEHICLES: ${PX4_VEHICLES:-3}
      PX4_GZ_WORLD: aeris_forest
    # Mounted so the launch script and world can change without rebuilding the 9 GB image.
    volumes:
      - ./docker/px4-sim/run_sim.sh:/opt/run_sim.sh:ro
      - ./sim/worlds/aeris_forest.sdf:/opt/px4/Tools/simulation/gz/worlds/aeris_forest.sdf:ro
    # DDS discovery uses multicast on the compose network; the data path uses Fast DDS
    # shared memory, so the bridge shares this container's IPC namespace (see bridge.ipc).
    ipc: shareable
    ulimits:
      nofile: 65536
    shm_size: "1g"

  bridge:
    image: ${AERIS_BRIDGE_IMAGE:-ghcr.io/rohankc69/aeris-bridge:latest}
    build:
      context: .
      dockerfile: docker/bridge/Dockerfile
    profiles: ["px4"]
    environment:
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    ports:
      - "${AERIS_BRIDGE_PORT:-8765}:8765"
    depends_on:
      - px4-sim
    ipc: "service:px4-sim"

volumes:
  aeris_pg:
