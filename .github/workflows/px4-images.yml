name: PX4 images

# Builds the PX4 SITL + Gazebo image and the ROS 2 bridge image and publishes them to GHCR so
# contributors pull them instead of compiling PX4 locally. Runs on demand, on a monthly
# schedule, and whenever the Docker recipes or the bridge package change on main.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths:
      - "docker/px4-sim/**"
      - "docker/bridge/**"
      - "ros_ws/src/aeris_px4_bridge/**"
      - ".github/workflows/px4-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  px4-sim:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push px4-sim (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: docker/px4-sim
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aeris-px4-sim:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=px4-sim-${{ matrix.arch }}
          cache-to: type=gha,scope=px4-sim-${{ matrix.arch }},mode=max

  bridge:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push bridge (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/bridge/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aeris-bridge:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=bridge-${{ matrix.arch }}
          cache-to: type=gha,scope=bridge-${{ matrix.arch }},mode=max

  manifests:
    needs: [px4-sim, bridge]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch tags
        run: |
          for img in aeris-px4-sim aeris-bridge; do
            docker buildx imagetools create \
              -t ghcr.io/${{ github.repository_owner }}/$img:latest \
              ghcr.io/${{ github.repository_owner }}/$img:latest-amd64 \
              ghcr.io/${{ github.repository_owner }}/$img:latest-arm64
          done
