name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    env:
      AERIS_ENV: test
      AERIS_FLEET_PROVIDER: fake
      AERIS_DECISION_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy aeris
      - name: Tests (mock provider, fake fleet, no network)
        run: uv run pytest -q
