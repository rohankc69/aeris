# A missing person lies in the north-east of the region. Drone sensors pick them up when they
# pass within range; a weak first hit is followed by stronger evidence, AERIS escalates a
# candidate, and the operator confirms at T+8 min. Mission must end PERSON_LOCATED.
name: candidate_detection
description: Sensor detections are triaged, investigated, escalated and confirmed by the operator.
seed: 6
base_position: { latitude: 47.3769, longitude: 8.5417, altitude_m: 0 }
search_polygon:
  vertices:
    - { latitude: 47.3780, longitude: 8.5430 }
    - { latitude: 47.3780, longitude: 8.5510 }
    - { latitude: 47.3834, longitude: 8.5510 }
    - { latitude: 47.3834, longitude: 8.5430 }
missing_person:
  position: { latitude: 47.3826, longitude: 8.5496 }
  detection_range_m: 60
  thermal_confidence: 0.45
  visual_confidence: 0.30
search_altitude_m: 60
overlap_fraction: 0.2
zone_size_m: 200
tick_s: 1.0
max_duration_s: 3600
drones:
  - drone_id: drone-01
    capability: { camera: true, thermal: true, cruise_speed_mps: 10, camera_footprint_width_m: 40 }
  - drone_id: drone-02
    capability: { camera: true, thermal: false, cruise_speed_mps: 10, camera_footprint_width_m: 40 }
  - drone_id: drone-03
    capability: { camera: true, thermal: true, cruise_speed_mps: 10, camera_footprint_width_m: 40 }
events:
  - { at_s: 300, type: detection, drone_id: drone-03, source: THERMAL, value: 0.82, movement: true, note: "strong thermal on the investigation pass" }
  - { at_s: 302, type: detection, drone_id: drone-03, source: VISUAL, value: 0.74, note: "visual agrees" }
  - { at_s: 480, type: operator_confirm, note: "operator confirms survivor" }
